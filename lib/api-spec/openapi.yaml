openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Legend Bucks rewards platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: employees
    description: Employee management
  - name: transactions
    description: Transaction ledger
  - name: rewards
    description: Rewards catalog
  - name: redemptions
    description: Redemption management
  - name: goals
    description: Team goals
  - name: team-budgets
    description: Per-department yearly team budget pools
  - name: dashboard
    description: Dashboard summary data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthenticated

  /auth/me/notifications:
    patch:
      operationId: updateNotificationPreferences
      tags: [auth]
      summary: Update the current user's email notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Unauthenticated

  /auth/login:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Request a magic link login email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "200":
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResponse"
        "400":
          description: Invalid email

  /auth/verify:
    post:
      operationId: verifyMagicLink
      tags: [auth]
      summary: Verify a magic link token and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkVerify"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid or expired token

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and clear session
      responses:
        "204":
          description: Logged out

  /auth/invite:
    post:
      operationId: inviteEmployee
      tags: [auth]
      summary: Admin invites a new employee by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  # Employees
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      parameters:
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: locationId
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: managerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found

  /employees/{id}/balance:
    get:
      operationId: getEmployeeBalance
      tags: [employees]
      summary: Get an employee's current balance calculated from ledger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"

  /employees/{id}/deactivate:
    patch:
      operationId: deactivateEmployee
      tags: [employees]
      summary: Deactivate an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}/award-cap:
    get:
      operationId: getEmployeeAwardCap
      tags: [employees]
      summary: >-
        Get an employee's yearly per-employee award cap and this-year remaining.
        Restricted to admins and the employee's assigned manager; never exposed
        to the employee themselves or to unrelated managers.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Award cap info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwardCapInfo"
        "403":
          description: Forbidden
        "404":
          description: Not found

  # Transactions (Ledger)
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List ledger transactions
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            description: "ISO date string start"
        - name: to
          in: query
          schema:
            type: string
            description: "ISO date string end"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
    post:
      operationId: sendBucks
      tags: [transactions]
      summary: Send Legend Bucks to an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBucksInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Award cap exceeded or bad request
        "403":
          description: Forbidden

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a single transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found

  /transactions/export:
    get:
      operationId: exportTransactions
      tags: [transactions]
      summary: Export transactions as CSV (admin only)
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Aggregated bucks sent/received stats for dashboard
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Transaction summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"

  # Departments
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List all departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "403":
          description: Forbidden
        "409":
          description: A department with that name already exists

  /departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Rename a department (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
        "409":
          description: A department with that name already exists
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Department still has employees assigned

  /departments/{id}/reassign:
    post:
      operationId: reassignDepartment
      tags: [departments]
      summary: Move all employees from one department to another, or clear them (admin only)
      description: >-
        Reassigns every employee currently in this department to the target
        department (or clears their department when reassignTo is null). Used
        to empty a department before deleting it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignInput"
      responses:
        "200":
          description: Reassignment complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignResult"
        "400":
          description: Invalid reassignment target
        "403":
          description: Forbidden
        "404":
          description: Not found

  # Locations
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all locations
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "403":
          description: Forbidden
        "409":
          description: A location with that name already exists

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Rename a location (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Not found
        "409":
          description: A location with that name already exists
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Location still has employees assigned

  /locations/{id}/reassign:
    post:
      operationId: reassignLocation
      tags: [locations]
      summary: Move all employees from one location to another, or clear them (admin only)
      description: >-
        Reassigns every employee currently in this location to the target
        location (or clears their location when reassignTo is null). Used to
        empty a location before deleting it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignInput"
      responses:
        "200":
          description: Reassignment complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignResult"
        "400":
          description: Invalid reassignment target
        "403":
          description: Forbidden
        "404":
          description: Not found

  # Rewards
  /rewards:
    get:
      operationId: listRewards
      tags: [rewards]
      summary: List available rewards
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reward"
    post:
      operationId: createReward
      tags: [rewards]
      summary: Create a new reward (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardInput"
      responses:
        "201":
          description: Created reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "403":
          description: Forbidden

  /rewards/{id}:
    get:
      operationId: getReward
      tags: [rewards]
      summary: Get a reward by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "404":
          description: Not found
    patch:
      operationId: updateReward
      tags: [rewards]
      summary: Update a reward (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardUpdate"
      responses:
        "200":
          description: Updated reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "404":
          description: Not found
    delete:
      operationId: deleteReward
      tags: [rewards]
      summary: Delete a reward (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Redemptions
  /redemptions:
    get:
      operationId: listRedemptions
      tags: [redemptions]
      summary: List redemptions
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: pendingApproval
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redemption"
    post:
      operationId: createRedemption
      tags: [redemptions]
      summary: Redeem a reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionInput"
      responses:
        "201":
          description: Redemption created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"
        "400":
          description: Insufficient balance or out of stock

  /redemptions/{id}:
    get:
      operationId: getRedemption
      tags: [redemptions]
      summary: Get a redemption by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"
        "404":
          description: Not found

  /redemptions/{id}/approve:
    patch:
      operationId: approveRedemption
      tags: [redemptions]
      summary: Approve a pending redemption (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/reject:
    patch:
      operationId: rejectRedemption
      tags: [redemptions]
      summary: Reject a redemption and refund bucks (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionDecision"
      responses:
        "200":
          description: Rejected redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/cancel:
    patch:
      operationId: cancelRedemption
      tags: [redemptions]
      summary: Cancel a redemption and refund bucks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/fulfill:
    patch:
      operationId: fulfillRedemption
      tags: [redemptions]
      summary: Mark a redemption as fulfilled (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fulfilled redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  # Team Goals
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List team goals
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a team goal (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a team goal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/contribute:
    post:
      operationId: contributeToGoal
      tags: [goals]
      summary: Contribute bucks to a team goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalContribution"
      responses:
        "201":
          description: Contribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/award-from-budget:
    post:
      operationId: awardFromTeamBudget
      tags: [goals]
      summary: >-
        Award bucks from a department's team budget pool toward this team goal.
        Draws down the department's yearly pool and increases the goal's
        progress; funds the goal only, never any individual balance. Allowed for
        admins and managers of the goal's department; blocked if the pool can't
        cover the amount.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalBudgetAward"
      responses:
        "201":
          description: Award recorded, goal progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Insufficient team budget or bad request
        "403":
          description: Forbidden
        "404":
          description: Goal not found, inactive, or has no department

  /goals/{id}/contributions:
    get:
      operationId: listGoalContributions
      tags: [goals]
      summary: List contributions for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalContributionRecord"

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [dashboard]
      summary: Top employees by bucks received this month
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  # Team budgets
  /team-budgets:
    get:
      operationId: listTeamBudgets
      tags: [team-budgets]
      summary: >-
        List every department's team budget for the current year with amount,
        used, and remaining. Admin only.
      responses:
        "200":
          description: Team budgets for the current year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamBudget"
        "403":
          description: Forbidden

  /team-budgets/{departmentId}:
    get:
      operationId: getTeamBudget
      tags: [team-budgets]
      summary: >-
        Get a single department's team budget for the current year (amount,
        used, remaining). Allowed for admins and managers of that department.
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBudget"
        "403":
          description: Forbidden
        "404":
          description: Department not found
    put:
      operationId: setTeamBudget
      tags: [team-budgets]
      summary: Set (upsert) a department's team budget for the current year. Admin only.
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamBudgetInput"
      responses:
        "200":
          description: Updated team budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBudget"
        "403":
          description: Forbidden
        "404":
          description: Department not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CurrentUser:
      type: object
      required: [id, firstName, lastName, email, role, status, notifyBucksReceived, notifyRedemptionUpdates]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        department:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        location:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: integer
          description: Current Legend Bucks balance
        notifyBucksReceived:
          type: boolean
          description: Receive an email when awarded Legend Bucks
        notifyRedemptionUpdates:
          type: boolean
          description: Receive emails about reward redemption status

    NotificationPreferences:
      type: object
      required: [notifyBucksReceived, notifyRedemptionUpdates]
      properties:
        notifyBucksReceived:
          type: boolean
        notifyRedemptionUpdates:
          type: boolean

    AuthSession:
      type: object
      required: [id, firstName, lastName, email, role, status, token]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        department:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        location:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: integer
          description: Current Legend Bucks balance
        token:
          type: string
          description: Session token to store client-side and send as Bearer auth

    Department:
      type: object
      required: [id, name, employeeCount]
      properties:
        id:
          type: integer
        name:
          type: string
        employeeCount:
          type: integer
          description: Number of employees currently assigned to this department

    Location:
      type: object
      required: [id, name, employeeCount]
      properties:
        id:
          type: integer
        name:
          type: string
        employeeCount:
          type: integer
          description: Number of employees currently assigned to this location

    OrgUnitInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    ReassignInput:
      type: object
      required: [reassignTo]
      properties:
        reassignTo:
          type: integer
          nullable: true
          description: >-
            Target department/location id to move employees to, or null to
            clear their assignment.

    ReassignResult:
      type: object
      required: [reassigned]
      properties:
        reassigned:
          type: integer
          description: Number of employees that were reassigned

    Employee:
      type: object
      required: [id, firstName, lastName, email, role, status, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        department:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        locationId:
          type: ["integer", "null"]
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: ["integer", "null"]
        createdAt:
          type: string

    EmployeeUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        departmentId:
          type: ["integer", "null"]
        locationId:
          type: ["integer", "null"]
        managerId:
          type: ["integer", "null"]
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        status:
          type: string
          enum: [active, inactive]
        awardCapYearly:
          type: ["integer", "null"]
          minimum: 1
          description: >-
            Yearly cap on bucks this employee's manager may award them. null
            clears the cap (no limit). Admin-only.

    BalanceSummary:
      type: object
      required: [employeeId, balance, totalReceived, totalSpent]
      properties:
        employeeId:
          type: integer
        balance:
          type: integer
        totalReceived:
          type: integer
        totalSpent:
          type: integer

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    MagicLinkResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        token:
          type: ["string", "null"]
          description: Only included in dev mode for easy testing

    MagicLinkVerify:
      type: object
      required: [token]
      properties:
        token:
          type: string

    InviteInput:
      type: object
      required: [email, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        departmentId:
          type: ["integer", "null"]
        locationId:
          type: ["integer", "null"]
        managerId:
          type: ["integer", "null"]
        awardCapYearly:
          type: ["integer", "null"]
          minimum: 1
          description: >-
            Optional yearly cap on bucks this employee's manager may award them.
            Omit to leave unchanged; null clears the cap (no limit). Admin-only.

    AwardCapInfo:
      type: object
      required: [employeeId, cap, usedThisYear, remaining]
      properties:
        employeeId:
          type: integer
        cap:
          type: ["integer", "null"]
          description: The yearly award cap in bucks, or null if no cap is set.
        usedThisYear:
          type: integer
          description: Bucks the assigned manager has already awarded this employee this calendar year.
        remaining:
          type: ["integer", "null"]
          description: Bucks remaining under the cap this year, or null if no cap is set.

    Transaction:
      type: object
      required: [id, type, amount, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [award, redemption_debit, refund, contribution, adjustment, team_goal_award]
        amount:
          type: integer
        fromEmployeeId:
          type: ["integer", "null"]
        fromEmployeeName:
          type: ["string", "null"]
        toEmployeeId:
          type: ["integer", "null"]
        toEmployeeName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        redemptionId:
          type: ["integer", "null"]
        cadValueCents:
          type: ["integer", "null"]
          description: For redemption rows, the reward's CAD value in cents. Only populated for admins (accounting).
        goalId:
          type: ["integer", "null"]
        createdAt:
          type: string

    TransactionPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    SendBucksInput:
      type: object
      required: [toEmployeeId, amount]
      properties:
        toEmployeeId:
          type: integer
        amount:
          type: integer
          minimum: 1
        note:
          type: string

    TransactionSummary:
      type: object
      required: [totalSent, totalReceived, thisMonthSent, thisMonthReceived]
      properties:
        totalSent:
          type: integer
        totalReceived:
          type: integer
        thisMonthSent:
          type: integer
        thisMonthReceived:
          type: integer

    Reward:
      type: object
      required: [id, name, buckCost, active, approvalRequired, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        buckCost:
          type: integer
        cadValueCents:
          type: ["integer", "null"]
          description: Real-money value in CAD cents. Only returned to admins (accounting-only).
        imageUrl:
          type: ["string", "null"]
        quantity:
          type: ["integer", "null"]
          description: null means unlimited
        locationRestriction:
          type: ["string", "null"]
        active:
          type: boolean
        approvalRequired:
          type: boolean
        createdAt:
          type: string

    RewardInput:
      type: object
      required: [name, buckCost]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        buckCost:
          type: integer
          minimum: 1
        cadValueCents:
          type: ["integer", "null"]
        imageUrl:
          type: string
        quantity:
          type: ["integer", "null"]
        locationRestriction:
          type: ["string", "null"]
        active:
          type: boolean
        approvalRequired:
          type: boolean

    RewardUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        buckCost:
          type: integer
          minimum: 1
        cadValueCents:
          type: ["integer", "null"]
        imageUrl:
          type: ["string", "null"]
        quantity:
          type: ["integer", "null"]
        locationRestriction:
          type: ["string", "null"]
        active:
          type: boolean
        approvalRequired:
          type: boolean

    Redemption:
      type: object
      required: [id, employeeId, rewardId, status, buckCost, createdAt]
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        rewardId:
          type: integer
        rewardName:
          type: string
        status:
          type: string
          enum: [requested, approved, rejected, fulfilled, cancelled]
        buckCost:
          type: integer
        cadValueCents:
          type: ["integer", "null"]
        note:
          type: ["string", "null"]
        adminNote:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    RedemptionInput:
      type: object
      required: [rewardId]
      properties:
        rewardId:
          type: integer
        note:
          type: string

    RedemptionDecision:
      type: object
      properties:
        adminNote:
          type: string

    Goal:
      type: object
      required: [id, name, targetAmount, currentAmount, active, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
          description: Resolved department name (from departmentId when linked).
        departmentId:
          type: ["integer", "null"]
          description: Linked department id, or null for a company-wide goal.
        targetAmount:
          type: integer
        currentAmount:
          type: integer
        progressPercent:
          type: integer
        active:
          type: boolean
        endsAt:
          type: ["string", "null"]
        createdAt:
          type: string

    GoalInput:
      type: object
      required: [name, targetAmount]
      properties:
        name:
          type: string
        description:
          type: string
        departmentId:
          type: ["integer", "null"]
          description: Department this goal belongs to, or null for company-wide.
        targetAmount:
          type: integer
          minimum: 1
        active:
          type: boolean
        endsAt:
          type: ["string", "null"]

    GoalUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
          description: Department this goal belongs to, or null for company-wide.
        targetAmount:
          type: integer
        active:
          type: boolean
        endsAt:
          type: ["string", "null"]

    GoalContribution:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1

    GoalContributionRecord:
      type: object
      required: [id, goalId, employeeId, amount, createdAt]
      properties:
        id:
          type: integer
        goalId:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        amount:
          type: integer
        createdAt:
          type: string

    GoalBudgetAward:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1

    TeamBudget:
      type: object
      required: [departmentId, departmentName, year, amount, used, remaining]
      properties:
        departmentId:
          type: integer
        departmentName:
          type: string
        year:
          type: integer
        amount:
          type: integer
          description: Total pool set for this department this year (0 if unset).
        used:
          type: integer
          description: Bucks already awarded from the pool this year.
        remaining:
          type: integer
          description: amount minus used (never negative in practice).

    TeamBudgetInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Total pool for this department for the current year.

    DashboardSummary:
      type: object
      required: [totalEmployees, totalBucksAwarded, totalRedemptions, pendingApprovals, activeGoals]
      properties:
        totalEmployees:
          type: integer
        activeEmployees:
          type: integer
        totalBucksAwarded:
          type: integer
        thisMonthBucksAwarded:
          type: integer
        totalRedemptions:
          type: integer
        pendingApprovals:
          type: integer
        activeGoals:
          type: integer
        topDepartment:
          type: ["string", "null"]

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [award, redemption, goal_contribution, new_employee, budget_assigned]
        description:
          type: string
        actorName:
          type: ["string", "null"]
        targetName:
          type: ["string", "null"]
        amount:
          type: ["integer", "null"]
        createdAt:
          type: string

    LeaderboardEntry:
      type: object
      required: [rank, employeeId, employeeName, bucksReceived]
      properties:
        rank:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        department:
          type: ["string", "null"]
        bucksReceived:
          type: integer
