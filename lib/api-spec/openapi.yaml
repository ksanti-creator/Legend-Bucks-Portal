openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Legend Bucks rewards platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: employees
    description: Employee management
  - name: budgets
    description: Budget management
  - name: transactions
    description: Transaction ledger
  - name: rewards
    description: Rewards catalog
  - name: redemptions
    description: Redemption management
  - name: goals
    description: Team goals
  - name: dashboard
    description: Dashboard summary data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthenticated

  /auth/login:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Request a magic link login email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "200":
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResponse"
        "400":
          description: Invalid email

  /auth/verify:
    post:
      operationId: verifyMagicLink
      tags: [auth]
      summary: Verify a magic link token and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkVerify"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid or expired token

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and clear session
      responses:
        "204":
          description: Logged out

  /auth/invite:
    post:
      operationId: inviteEmployee
      tags: [auth]
      summary: Admin invites a new employee by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  # Employees
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: managerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found

  /employees/{id}/balance:
    get:
      operationId: getEmployeeBalance
      tags: [employees]
      summary: Get an employee's current balance calculated from ledger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"

  /employees/{id}/deactivate:
    patch:
      operationId: deactivateEmployee
      tags: [employees]
      summary: Deactivate an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  # Budgets
  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: List monthly budgets
      parameters:
        - name: managerId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
            description: "Format: YYYY-MM"
      responses:
        "200":
          description: List of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
    post:
      operationId: assignBudget
      tags: [budgets]
      summary: Assign or update monthly budget for a manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Budget assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "400":
          description: Bad request

  /budgets/{id}:
    get:
      operationId: getBudget
      tags: [budgets]
      summary: Get a budget record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "404":
          description: Not found

  /budgets/remaining:
    get:
      operationId: getMyBudgetRemaining
      tags: [budgets]
      summary: Get the current authenticated manager's remaining budget for this month
      responses:
        "200":
          description: Remaining budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetRemaining"

  # Transactions (Ledger)
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List ledger transactions
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            description: "ISO date string start"
        - name: to
          in: query
          schema:
            type: string
            description: "ISO date string end"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
    post:
      operationId: sendBucks
      tags: [transactions]
      summary: Send Legend Bucks to an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBucksInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Insufficient budget or bad request
        "403":
          description: Forbidden

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a single transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found

  /transactions/export:
    get:
      operationId: exportTransactions
      tags: [transactions]
      summary: Export transactions as CSV (admin only)
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Aggregated bucks sent/received stats for dashboard
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Transaction summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"

  # Rewards
  /rewards:
    get:
      operationId: listRewards
      tags: [rewards]
      summary: List available rewards
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reward"
    post:
      operationId: createReward
      tags: [rewards]
      summary: Create a new reward (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardInput"
      responses:
        "201":
          description: Created reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "403":
          description: Forbidden

  /rewards/{id}:
    get:
      operationId: getReward
      tags: [rewards]
      summary: Get a reward by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "404":
          description: Not found
    patch:
      operationId: updateReward
      tags: [rewards]
      summary: Update a reward (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardUpdate"
      responses:
        "200":
          description: Updated reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "404":
          description: Not found
    delete:
      operationId: deleteReward
      tags: [rewards]
      summary: Delete a reward (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Redemptions
  /redemptions:
    get:
      operationId: listRedemptions
      tags: [redemptions]
      summary: List redemptions
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: pendingApproval
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redemption"
    post:
      operationId: createRedemption
      tags: [redemptions]
      summary: Redeem a reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionInput"
      responses:
        "201":
          description: Redemption created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"
        "400":
          description: Insufficient balance or out of stock

  /redemptions/{id}:
    get:
      operationId: getRedemption
      tags: [redemptions]
      summary: Get a redemption by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"
        "404":
          description: Not found

  /redemptions/{id}/approve:
    patch:
      operationId: approveRedemption
      tags: [redemptions]
      summary: Approve a pending redemption (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/reject:
    patch:
      operationId: rejectRedemption
      tags: [redemptions]
      summary: Reject a redemption and refund bucks (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionDecision"
      responses:
        "200":
          description: Rejected redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/cancel:
    patch:
      operationId: cancelRedemption
      tags: [redemptions]
      summary: Cancel a redemption and refund bucks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/fulfill:
    patch:
      operationId: fulfillRedemption
      tags: [redemptions]
      summary: Mark a redemption as fulfilled (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fulfilled redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  # Team Goals
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List team goals
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a team goal (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a team goal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/contribute:
    post:
      operationId: contributeToGoal
      tags: [goals]
      summary: Contribute bucks to a team goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalContribution"
      responses:
        "201":
          description: Contribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/contributions:
    get:
      operationId: listGoalContributions
      tags: [goals]
      summary: List contributions for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalContributionRecord"

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [dashboard]
      summary: Top employees by bucks received this month
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CurrentUser:
      type: object
      required: [id, firstName, lastName, email, role, status]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member]
        department:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: integer
          description: Current Legend Bucks balance

    AuthSession:
      type: object
      required: [id, firstName, lastName, email, role, status, token]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member]
        department:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: integer
          description: Current Legend Bucks balance
        token:
          type: string
          description: Session token to store client-side and send as Bearer auth

    Employee:
      type: object
      required: [id, firstName, lastName, email, role, status, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        department:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, team_member]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: ["integer", "null"]
        createdAt:
          type: string

    EmployeeUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        department:
          type: string
        location:
          type: string
        managerId:
          type: ["integer", "null"]
        role:
          type: string
          enum: [admin, manager, team_member]
        status:
          type: string
          enum: [active, inactive]

    BalanceSummary:
      type: object
      required: [employeeId, balance, totalReceived, totalSpent]
      properties:
        employeeId:
          type: integer
        balance:
          type: integer
        totalReceived:
          type: integer
        totalSpent:
          type: integer

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    MagicLinkResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        token:
          type: ["string", "null"]
          description: Only included in dev mode for easy testing

    MagicLinkVerify:
      type: object
      required: [token]
      properties:
        token:
          type: string

    InviteInput:
      type: object
      required: [email, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member]
        department:
          type: string
        location:
          type: string
        managerId:
          type: ["integer", "null"]

    Budget:
      type: object
      required: [id, managerId, month, totalAmount, usedAmount, createdAt]
      properties:
        id:
          type: integer
        managerId:
          type: integer
        managerName:
          type: string
        month:
          type: string
          description: "Format: YYYY-MM"
        totalAmount:
          type: integer
        usedAmount:
          type: integer
        remainingAmount:
          type: integer
        createdAt:
          type: string

    BudgetInput:
      type: object
      required: [managerId, month, totalAmount]
      properties:
        managerId:
          type: integer
        month:
          type: string
          description: "Format: YYYY-MM"
        totalAmount:
          type: integer
          minimum: 0

    BudgetRemaining:
      type: object
      required: [managerId, month, totalAmount, usedAmount, remainingAmount]
      properties:
        managerId:
          type: integer
        month:
          type: string
        totalAmount:
          type: integer
        usedAmount:
          type: integer
        remainingAmount:
          type: integer

    Transaction:
      type: object
      required: [id, type, amount, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [award, redemption_debit, refund, contribution, adjustment]
        amount:
          type: integer
        fromEmployeeId:
          type: ["integer", "null"]
        fromEmployeeName:
          type: ["string", "null"]
        toEmployeeId:
          type: ["integer", "null"]
        toEmployeeName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        redemptionId:
          type: ["integer", "null"]
        cadValueCents:
          type: ["integer", "null"]
          description: For redemption rows, the reward's CAD value in cents. Only populated for admins (accounting).
        goalId:
          type: ["integer", "null"]
        createdAt:
          type: string

    TransactionPage:
