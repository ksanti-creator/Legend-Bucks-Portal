openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Legend Bucks rewards platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: employees
    description: Employee management
  - name: transactions
    description: Transaction ledger
  - name: rewards
    description: Rewards catalog
  - name: redemptions
    description: Redemption management
  - name: goals
    description: Team goals
  - name: settings
    description: Global application settings
  - name: dashboard
    description: Dashboard summary data
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthenticated

  /auth/me/notifications:
    patch:
      operationId: updateNotificationPreferences
      tags: [auth]
      summary: Update the current user's email notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          description: Unauthenticated

  /auth/login:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Request a magic link login email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "200":
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResponse"
        "400":
          description: Invalid email

  /auth/verify:
    post:
      operationId: verifyMagicLink
      tags: [auth]
      summary: Verify a magic link token and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkVerify"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid or expired token

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and clear session
      responses:
        "204":
          description: Logged out

  /auth/invite:
    post:
      operationId: inviteEmployee
      tags: [auth]
      summary: Admin invites a new employee by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  # Employees
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      parameters:
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: locationId
          in: query
          schema:
            type: integer
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: managerId
          in: query
          description: >-
            Filter to the given manager's whole subtree — every direct AND
            indirect report beneath them across the management chain, not just
            their immediate reports.
          schema:
            type: integer
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found

  /employees/{id}/balance:
    get:
      operationId: getEmployeeBalance
      tags: [employees]
      summary: Get an employee's current balance calculated from ledger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"

  /employees/{id}/deactivate:
    patch:
      operationId: deactivateEmployee
      tags: [employees]
      summary: Deactivate an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}/award-budget:
    get:
      operationId: getEmployeeAwardBudget
      tags: [employees]
      summary: >-
        Get an employee's yearly award budget, this-year usage, and remaining.
        This is the pool the user (a manager/admin) draws down when awarding
        bucks. Restricted to admins and the employee themselves.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Award budget info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwardBudgetInfo"
        "403":
          description: Forbidden
        "404":
          description: Not found

  # Transactions (Ledger)
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List ledger transactions
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            description: "ISO date string start"
        - name: to
          in: query
          schema:
            type: string
            description: "ISO date string end"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
    post:
      operationId: sendBucks
      tags: [transactions]
      summary: Send Legend Bucks to an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendBucksInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Award cap exceeded or bad request
        "403":
          description: Forbidden

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a single transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found

  /transactions/export:
    get:
      operationId: exportTransactions
      tags: [transactions]
      summary: Export transactions as CSV (admin only)
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Aggregated bucks sent/received stats for dashboard
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Transaction summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"

  # Departments
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List all departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "403":
          description: Forbidden
        "409":
          description: A department with that name already exists

  /departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Rename a department (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
        "409":
          description: A department with that name already exists
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Department still has employees assigned

  /departments/{id}/reassign:
    post:
      operationId: reassignDepartment
      tags: [departments]
      summary: Move all employees from one department to another, or clear them (admin only)
      description: >-
        Reassigns every employee currently in this department to the target
        department (or clears their department when reassignTo is null). Used
        to empty a department before deleting it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignInput"
      responses:
        "200":
          description: Reassignment complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignResult"
        "400":
          description: Invalid reassignment target
        "403":
          description: Forbidden
        "404":
          description: Not found

  # Locations
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all locations
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "403":
          description: Forbidden
        "409":
          description: A location with that name already exists

  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Rename a location (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Not found
        "409":
          description: A location with that name already exists
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Location still has employees assigned

  /locations/{id}/reassign:
    post:
      operationId: reassignLocation
      tags: [locations]
      summary: Move all employees from one location to another, or clear them (admin only)
      description: >-
        Reassigns every employee currently in this location to the target
        location (or clears their location when reassignTo is null). Used to
        empty a location before deleting it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignInput"
      responses:
        "200":
          description: Reassignment complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignResult"
        "400":
          description: Invalid reassignment target
        "403":
          description: Forbidden
        "404":
          description: Not found

  # Rewards
  /rewards:
    get:
      operationId: listRewards
      tags: [rewards]
      summary: List available rewards
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reward"
    post:
      operationId: createReward
      tags: [rewards]
      summary: Create a new reward (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardInput"
      responses:
        "201":
          description: Created reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "403":
          description: Forbidden

  /rewards/{id}:
    get:
      operationId: getReward
      tags: [rewards]
      summary: Get a reward by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "404":
          description: Not found
    patch:
      operationId: updateReward
      tags: [rewards]
      summary: Update a reward (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewardUpdate"
      responses:
        "200":
          description: Updated reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "404":
          description: Not found
    delete:
      operationId: deleteReward
      tags: [rewards]
      summary: Delete a reward (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Redemptions
  /redemptions:
    get:
      operationId: listRedemptions
      tags: [redemptions]
      summary: List redemptions
      parameters:
        - name: employeeId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: pendingApproval
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redemption"
    post:
      operationId: createRedemption
      tags: [redemptions]
      summary: Redeem a reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionInput"
      responses:
        "201":
          description: Redemption created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"
        "400":
          description: Insufficient balance or out of stock

  /redemptions/{id}:
    get:
      operationId: getRedemption
      tags: [redemptions]
      summary: Get a redemption by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"
        "404":
          description: Not found

  /redemptions/{id}/approve:
    patch:
      operationId: approveRedemption
      tags: [redemptions]
      summary: Approve a pending redemption (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/reject:
    patch:
      operationId: rejectRedemption
      tags: [redemptions]
      summary: Reject a redemption and refund bucks (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionDecision"
      responses:
        "200":
          description: Rejected redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/cancel:
    patch:
      operationId: cancelRedemption
      tags: [redemptions]
      summary: Cancel a redemption and refund bucks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  /redemptions/{id}/fulfill:
    patch:
      operationId: fulfillRedemption
      tags: [redemptions]
      summary: Mark a redemption as fulfilled (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fulfilled redemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"

  # Team Goals
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List team goals
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: >-
        Create a team goal. Admins can create for any department; managers can
        create only for their own department. A department is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a team goal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: >-
        Update a goal. Admins can update any goal; managers can update goals for
        their own department only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/contribute:
    post:
      operationId: contributeToGoal
      tags: [goals]
      summary: Contribute bucks to a team goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalContribution"
      responses:
        "201":
          description: Contribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/contributions:
    get:
      operationId: listGoalContributions
      tags: [goals]
      summary: List contributions for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalContributionRecord"

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [dashboard]
      summary: Top employees by bucks received this month
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  # Settings
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get global application settings (any authenticated user).
      responses:
        "200":
          description: Global settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update global application settings. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "403":
          description: Forbidden

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload (admin only)
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden.
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`).
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CurrentUser:
      type: object
      required: [id, firstName, lastName, email, role, status, notifyBucksReceived, notifyRedemptionUpdates, notifyNewRedemptionRequests]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        department:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        location:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: integer
          description: Current Legend Bucks balance
        notifyBucksReceived:
          type: boolean
          description: Receive an email when awarded Legend Bucks
        notifyRedemptionUpdates:
          type: boolean
          description: Receive emails about reward redemption status
        notifyNewRedemptionRequests:
          type: boolean
          description: Receive an email when a new redemption request needs your attention (admins/managers)

    NotificationPreferences:
      type: object
      required: [notifyBucksReceived, notifyRedemptionUpdates, notifyNewRedemptionRequests]
      properties:
        notifyBucksReceived:
          type: boolean
        notifyRedemptionUpdates:
          type: boolean
        notifyNewRedemptionRequests:
          type: boolean

    AuthSession:
      type: object
      required: [id, firstName, lastName, email, role, status, token]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        department:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        location:
          type: ["string", "null"]
        managerId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: integer
          description: Current Legend Bucks balance
        token:
          type: string
          description: Session token to store client-side and send as Bearer auth

    Department:
      type: object
      required: [id, name, employeeCount]
      properties:
        id:
          type: integer
        name:
          type: string
        employeeCount:
          type: integer
          description: Number of employees currently assigned to this department

    Location:
      type: object
      required: [id, name, employeeCount]
      properties:
        id:
          type: integer
        name:
          type: string
        employeeCount:
          type: integer
          description: Number of employees currently assigned to this location

    OrgUnitInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    ReassignInput:
      type: object
      required: [reassignTo]
      properties:
        reassignTo:
          type: integer
          nullable: true
          description: >-
            Target department/location id to move employees to, or null to
            clear their assignment.

    ReassignResult:
      type: object
      required: [reassigned]
      properties:
        reassigned:
          type: integer
          description: Number of employees that were reassigned

    Employee:
      type: object
      required: [id, firstName, lastName, email, role, status, createdAt]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        department:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        locationId:
          type: ["integer", "null"]
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        status:
          type: string
          enum: [active, inactive, invited]
        balance:
          type: ["integer", "null"]
        awardBudgetYearly:
          type: ["integer", "null"]
          description: >-
            This user's yearly award budget in bucks. Only populated for admins
            and the employee themselves; null otherwise.
        createdAt:
          type: string

    EmployeeUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        departmentId:
          type: ["integer", "null"]
        locationId:
          type: ["integer", "null"]
        managerId:
          type: ["integer", "null"]
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        status:
          type: string
          enum: [active, inactive]
        awardBudgetYearly:
          type: ["integer", "null"]
          minimum: 1
          description: >-
            Yearly award budget (in bucks) this user may draw down when awarding
            bucks to others. null clears it (cannot award). Admin-only.

    BalanceSummary:
      type: object
      required: [employeeId, balance, totalReceived, totalSpent]
      properties:
        employeeId:
          type: integer
        balance:
          type: integer
        totalReceived:
          type: integer
        totalSpent:
          type: integer

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    MagicLinkResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        token:
          type: ["string", "null"]
          description: Only included in dev mode for easy testing

    MagicLinkVerify:
      type: object
      required: [token]
      properties:
        token:
          type: string

    InviteInput:
      type: object
      required: [email, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, manager, team_member, accounting_admin]
        departmentId:
          type: ["integer", "null"]
        locationId:
          type: ["integer", "null"]
        managerId:
          type: ["integer", "null"]
        awardBudgetYearly:
          type: ["integer", "null"]
          minimum: 1
          description: >-
            Optional yearly award budget (in bucks) this user may draw down when
            awarding bucks. Omit to leave unset; null means no budget (cannot
            award). Admin-only.

    AwardBudgetInfo:
      type: object
      required: [employeeId, budget, usedThisYear, remaining]
      properties:
        employeeId:
          type: integer
        budget:
          type: ["integer", "null"]
          description: The yearly award budget in bucks, or null if none is set.
        usedThisYear:
          type: integer
          description: Bucks this user has awarded so far this UTC calendar year.
        remaining:
          type: ["integer", "null"]
          description: >-
            Bucks left in the budget this year, or null if no budget is set
            (which means the user cannot award).

    Transaction:
      type: object
      required: [id, type, amount, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [award, redemption_debit, refund, contribution, adjustment]
        amount:
          type: integer
        fromEmployeeId:
          type: ["integer", "null"]
        fromEmployeeName:
          type: ["string", "null"]
        toEmployeeId:
          type: ["integer", "null"]
        toEmployeeName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        redemptionId:
          type: ["integer", "null"]
        cadValueCents:
          type: ["integer", "null"]
          description: For redemption rows, the reward's CAD value in cents. Only populated for admins (accounting).
        goalId:
          type: ["integer", "null"]
        createdAt:
          type: string

    TransactionPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    SendBucksInput:
      type: object
      required: [toEmployeeId, amount]
      properties:
        toEmployeeId:
          type: integer
        amount:
          type: integer
          minimum: 1
        note:
          type: string

    TransactionSummary:
      type: object
      required: [totalSent, totalReceived, thisMonthSent, thisMonthReceived]
      properties:
        totalSent:
          type: integer
        totalReceived:
          type: integer
        thisMonthSent:
          type: integer
        thisMonthReceived:
          type: integer

    Reward:
      type: object
      required: [id, name, buckCost, active, approvalRequired, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        buckCost:
          type: integer
        cadValueCents:
          type: ["integer", "null"]
          description: Real-money value in CAD cents. Only returned to admins (accounting-only).
        productCode:
          type: ["string", "null"]
          description: Internal product code / SKU. Only returned to admins.
        serialNumber:
          type: ["string", "null"]
          description: Internal serial number. Only returned to admins.
        imageUrl:
          type: ["string", "null"]
          description: Cover image (first photo). Kept for backward compatibility.
        imageUrls:
          type: array
          items:
            type: string
          description: Ordered photo URLs; first entry is the cover image.
        quantity:
          type: ["integer", "null"]
          description: null means unlimited
        locationRestriction:
          type: ["string", "null"]
        active:
          type: boolean
        approvalRequired:
          type: boolean
        createdAt:
          type: string

    RewardInput:
      type: object
      required: [name, buckCost]
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        buckCost:
          type: integer
          minimum: 1
        cadValueCents:
          type: ["integer", "null"]
        productCode:
          type: ["string", "null"]
        serialNumber:
          type: ["string", "null"]
        imageUrl:
          type: string
        imageUrls:
          type: array
          items:
            type: string
          maxItems: 8
        quantity:
          type: ["integer", "null"]
        locationRestriction:
          type: ["string", "null"]
        active:
          type: boolean
        approvalRequired:
          type: boolean

    RewardUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        buckCost:
          type: integer
          minimum: 1
        cadValueCents:
          type: ["integer", "null"]
        productCode:
          type: ["string", "null"]
        serialNumber:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        imageUrls:
          type: array
          items:
            type: string
          maxItems: 8
        quantity:
          type: ["integer", "null"]
        locationRestriction:
          type: ["string", "null"]
        active:
          type: boolean
        approvalRequired:
          type: boolean

    Redemption:
      type: object
      required: [id, employeeId, rewardId, status, buckCost, createdAt]
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        rewardId:
          type: integer
        rewardName:
          type: string
        status:
          type: string
          enum: [requested, approved, rejected, fulfilled, cancelled]
        buckCost:
          type: integer
        cadValueCents:
          type: ["integer", "null"]
        note:
          type: ["string", "null"]
        adminNote:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    RedemptionInput:
      type: object
      required: [rewardId]
      properties:
        rewardId:
          type: integer
        note:
          type: string

    RedemptionDecision:
      type: object
      properties:
        adminNote:
          type: string

    Goal:
      type: object
      required: [id, name, targetAmount, currentAmount, active, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
          description: Resolved department name (from departmentId when linked).
        departmentId:
          type: ["integer", "null"]
          description: The department this goal belongs to.
        targetAmount:
          type: integer
        currentAmount:
          type: integer
        progressPercent:
          type: integer
        active:
          type: boolean
        endsAt:
          type: ["string", "null"]
        createdAt:
          type: string

    GoalInput:
      type: object
      required: [name, targetAmount, departmentId]
      properties:
        name:
          type: string
        description:
          type: string
        departmentId:
          type: integer
          description: >-
            The department this goal belongs to (required). Managers may only
            use their own department.
        targetAmount:
          type: integer
          minimum: 1
        active:
          type: boolean
        endsAt:
          type: ["string", "null"]

    GoalUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        departmentId:
          type: integer
          description: >-
            The department this goal belongs to. Managers may only use their own
            department.
        targetAmount:
          type: integer
        active:
          type: boolean
        endsAt:
          type: ["string", "null"]

    GoalContribution:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1

    GoalContributionRecord:
      type: object
      required: [id, goalId, employeeId, amount, createdAt]
      properties:
        id:
          type: integer
        goalId:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        amount:
          type: integer
        createdAt:
          type: string

    Settings:
      type: object
      required: [maxSingleAward]
      properties:
        maxSingleAward:
          type: ["integer", "null"]
          description: >-
            The maximum bucks allowed in a single award, or null for no limit.

    SettingsUpdate:
      type: object
      required: [maxSingleAward]
      properties:
        maxSingleAward:
          type: ["integer", "null"]
          minimum: 1
          description: >-
            The maximum bucks allowed in a single award. null removes the limit.

    DashboardSummary:
      type: object
      required: [totalEmployees, totalBucksAwarded, totalRedemptions, pendingApprovals, activeGoals]
      properties:
        totalEmployees:
          type: integer
        activeEmployees:
          type: integer
        totalBucksAwarded:
          type: integer
        thisMonthBucksAwarded:
          type: integer
        totalRedemptions:
          type: integer
        pendingApprovals:
          type: integer
        activeGoals:
          type: integer
        topDepartment:
          type: ["string", "null"]

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [award, redemption, goal_contribution, new_employee]
        description:
          type: string
        actorName:
          type: ["string", "null"]
        targetName:
          type: ["string", "null"]
        amount:
          type: ["integer", "null"]
        createdAt:
          type: string

    LeaderboardEntry:
      type: object
      required: [rank, employeeId, employeeName, bucksReceived]
      properties:
        rank:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        department:
          type: ["string", "null"]
        bucksReceived:
          type: integer
